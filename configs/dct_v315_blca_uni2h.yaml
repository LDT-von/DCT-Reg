# DCT v3.15 Residual Transport Interaction - BLCA UNI2-h Config
#
# 与 v3.10 robust (0.7208) 对齐的公平比较配置:
#   - encoder: uni2h (1536-dim)
#   - splits: 5fold_uni2h
#   - data_root: TCGA-UNI2-h-features
#   - patches: 2048 | epochs: 50 | slots: 8+8 | batch_size: 8
#
# 目的: 在完全相同的 encoder/split/patch/epochs/slot 设置下,
#       验证 v3.15 的极简 RTI 基线 vs v3.10 baseline
#
# v3.15: NLL-only Residual Transport Interaction
#   - 唯一训练损失: NLL
#   - 单次槽池化 + 一个 RTI 模块 (T - ab^T 双线性交互读出)
#   - 无 rank/diversity/reconstruction 辅助损失
#   - 参数量 460K (vs v3.10 的 ~6M)

name: dct_v315_blca_uni2h
description: |
  DCT v3.15 NLL-only residual transport interaction on BLCA UNI2-h.  This is
  a FAIR comparison config: all data/encoder/split/slot hyperparameters match
  v3.10 robust 50ep (0.7208).  Only the model architecture and loss differ.
  v3.15 is an independent NLL-only baseline with one RTI block; it is NOT
  an incremental improvement claim.  Experimental candidate, not a frozen paper
  method.  Must compare against same-encoder v3.10 and v3.14 to be meaningful.

data:
  study: blca
  data_root_dir: /data1/TCGA-UNI2-h-features
  data_path: /data1/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536

split:
  k_start: 0
  k_end: 5

train:
  survot_method: dct_v315_residual_transport
  specific_simple: dct_v315_blca_uni2h
  results_dir: /data1/DCT-Reg/results/dct_v315_blca_uni2h/blca
  max_epochs: 30
  batch_size: 8
  warmup_epochs: 0
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  min_free_space_gb: 2.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_stratified_batches: true
  event_sampling_fraction: 0.0

slot:
  slot_num_wsi: 8
  slot_num_omics: 8

model:
  wsi_encoder: uni2-h
  wsi_projection_dim: 256
  dct_v315_ot_epsilon: 0.20
  dct_v315_ot_iters: 40
  dct_v315_dropout: 0.10
  dct_v315_transport_mode: ot  # ot | independent (zero-interaction control)

split_setup:
  which_splits: 5fold_uni2h
  on_missing_wsi: error
