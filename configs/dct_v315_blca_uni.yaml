name: dct_v315_blca_uni
description: |
  Independent NLL-only baseline: one-shot slots and one residual transport
  interaction block. No rank/slot-NLL/diversity/reconstruction losses.
  Experimental candidate, not a frozen paper method or a validated improvement.
data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: /data1/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 4096
  encoding_dim: 1024
split:
  k_start: 0
  k_end: 5
train:
  survot_method: dct_v315_residual_transport
  specific_simple: dct_v315_blca_uni
  results_dir: /data1/DCT-Reg/results/dct_v315_blca_uni/blca
  max_epochs: 30
  batch_size: 32
  warmup_epochs: 0
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.0  # Ordinary censored likelihood; match alpha in any version comparison.
  min_free_space_gb: 2.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_stratified_batches: true
  event_sampling_fraction: 0.0
slot:
  slot_num_wsi: 8
  slot_num_omics: 8
model:
  wsi_encoder: uni
  wsi_projection_dim: 256
  dct_v315_ot_epsilon: 0.20
  dct_v315_ot_iters: 40
  dct_v315_dropout: 0.10
  dct_v315_transport_mode: ot  # independent is the exact zero-interaction control.
split_setup:
  which_splits: 5fold
  on_missing_wsi: error
