# DCT v3.11 Per-Slot Interpretable - BLCA UNI Config (FIXED v2)
# 修复内容: slot_diversity_loss 现在分别约束 WSI 和 Omics 槽的 variance
#   原版: variance = merged(WSI + Omics)，掩盖 WSI 坍缩
#   修复: loss = hinge(variance_wsi) + hinge(variance_omic)
#
# 训练命令: python -m survot_rank.cli train --config configs/dct_v311_blca_uni_v2.yaml
#
# Recipe: NLL + 0.10*IPCW-rank + 0.05*per_slot_nll + 0.02*diversity (per-modality)
# (dct_v311_* params are forced by DCTV311SlotInterpretable.FROZEN_ARGUMENTS)
#
name: dct_v311_blca_uni_v2
description: |
  DCT v3.11 per-slot interpretable training on BLCA with UNI features.
  FIXED v2: per-modality diversity loss.
    - survot_method: dct_v311_slot_interpretable
  - Objective: NLL + 0.10*IPCW-rank + 0.05*per_slot_nll + 0.02*(diversity_wsi + diversity_omic)
  - Direction loss disabled (dct_v38_lambda_direction=0.0)
  - Diversity: per-modality variance in [0.005, 0.050]

data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: /data1/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 4096
  encoding_dim: 1024

split:
  k_start: 0
  k_end: 5

train:
  survot_method: dct_v311_slot_interpretable
  specific_simple: dct_v311_blca_uni_v2
  results_dir: /data1/DCT-Reg/results/dct_v311_blca_uni_fixed_v2/blca
  max_epochs: 30
  batch_size: 8
  warmup_epochs: 0
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 1
  num_workers: 4
  bag_loss: nll_surv
  min_free_space_gb: 2.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  dct_slot_init_mode: deterministic
  event_stratified_batches: true
  event_sampling_fraction: 0.0

slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st

model:
  wsi_encoder: uni
  otehv2_eps: 0.05
  otehv2_iter: 50
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.15
  dct_num_stages: 4
  dct_lambda_ipcw_rank: 0.10
  dct_ipcw_rank_margin: 0.02
  dct_ipcw_rank_temperature: 0.50
  dct_ipcw_max_weight: 10.0
  dct_ipcw_rank_memory_size: 64
  # Direction loss DISABLED in v3.11 (DCR ≈ random)
  dct_v38_lambda_direction: 0.0
  dct_v38_lambda_dose: 0.0
  dct_v38_lambda_reconfiguration: 0.0
  dct_anchor_momentum: 0.90
  dct_evidence_cost_weight: 0.0
  dct_evidence_mass_floor: 0.05
  dct_evidence_marginal_strength: 1.0
  dct_geometry_reliability_strength: 0.0
  dct_coupling_projection_iters: 1000
  dct_coupling_projection_tol: 0.0001
  dct_coordinate_temperature: 0.30
  dct_mix_ratio: 1.0
  dct_v38_direction_margin: 0.02
  dct_v38_dose_margin: 0.005
  dct_v38_reconfiguration_margin: 0.02
  dct_v38_temperature: 0.05
  dct_v38_alpha_mid: 0.50
  dct_v38_alpha_full: 1.00
  dct_v38_warmup_epochs: 0
  dct_v38_ramp_epochs: 0
  dct_v38_dose_every: 1
  dct_lambda_etar: 0.0
  dct_lambda_listwise: 0.0
  spt_prog_cost: 0.20
  rg_eps_start: 0.10
  rg_eps_anneal: 12

split_setup:
  which_splits: 5fold
  on_missing_wsi: error
