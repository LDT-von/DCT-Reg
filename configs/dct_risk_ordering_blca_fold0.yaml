name: dct_risk_ordering_blca_fold0
description: Matched BLCA fold-0 screen with endpoint direction and dose ordering.

data:
  study: blca
  data_root_dir: /data1/TCGA-UNI2-h-features
  data_path: data/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536
split:
  k_start: 0
  k_end: 1
train:
  survot_method: dct_risk_ordering_transport
  specific_simple: risk_ordering_w010_d005_blca_fold0
  results_dir: results/transport_candidates
  max_epochs: 30
  batch_size: 8
  grad_accum_steps: 1
  warmup_epochs: 5
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  min_free_space_gb: 2.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  dct_slot_init_mode: deterministic
  event_stratified_batches: true
  event_sampling_fraction: 0.0
slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st
model:
  wsi_encoder: uni2-h
  otehv2_eps: 0.05
  otehv2_iter: 50
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.15
  dct_num_stages: 4
  dct_rot_lambda_direction: 0.10
  dct_rot_lambda_dose: 0.05
  dct_rot_direction_margin: 0.02
  dct_rot_dose_margin: 0.005
  dct_coupling_projection_iters: 1000
  dct_coupling_projection_tol: 0.0001
  dct_coordinate_temperature: 0.30
split_setup:
  which_splits: 5fold_uni2h
  on_missing_wsi: error
