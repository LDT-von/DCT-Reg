# Independent DCT v2 candidate. No MCAT/SurvPath host and no reconstruction losses.
# Six-term objective: NLL + IPCW rank + per-slot NLL + diversity + relation + native NLL.
# Server data locations below are inherited examples; verify your feature/split paths.
name: dct_v2_blca_uni2h
description: |
  Independent DCT v2 with semantic slots, stage-wise multi-geometry relaxed
  transport, native slot information and its own survival prediction head.
  New candidate recipe; historical v3.13 scores do not apply to this model.

data:
  study: blca
  data_root_dir: /data1/TCGA-UNI2-h-features
  data_path: /data1/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536

split:
  k_start: 0
  k_end: 5

train:
  survot_method: dct_v2
  specific_simple: dct_v2_blca_uni2h
  results_dir: /data1/DCT-Reg/results/dct_v2/blca
  max_epochs: 30
  batch_size: 8
  warmup_epochs: 0
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.0
  min_free_space_gb: 2.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_stratified_batches: true
  event_sampling_fraction: 0.0
  evaluation_protocol: outer_test
  inner_val_fraction: 0.20
  split_seed: 3

slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st

model:
  wsi_encoder: uni2-h
  wsi_projection_dim: 256
  dct_slot_init_mode: deterministic
  dct_num_stages: 4
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.15
  otehv2_eps: 0.05
  rg_eps_start: 0.10
  rg_eps_anneal: 12
  dct_evidence_cost_weight: 0.0
  dct_evidence_mass_floor: 0.05
  dct_evidence_marginal_strength: 1.0
  dct_coordinate_temperature: 0.30
  dct_v2_transport_mode: uot
  dct_v2_plan_mode: learned
  dct_v2_tau_wsi: 0.5
  dct_v2_tau_omics: 0.5
  dct_v2_uot_iters: 200
  dct_v2_uot_tolerance: 0.0000001
  dct_v2_mass_aware: true
  dct_v2_local_gating: true
  dct_v2_residual_init: 0.10
  dct_v2_projection_iters: 1000
  dct_v2_projection_tolerance: 0.000001
  dct_v2_min_plan_mass: 0.00000001
  dct_v2_lambda_ipcw_rank: 0.10
  dct_v2_lambda_slot_nll: 0.05
  dct_v2_lambda_diversity: 0.10
  dct_v2_lambda_relation: 0.05
  dct_v2_lambda_native: 0.05
  dct_v2_relation_warmup_epochs: 3
  dct_v2_relation_ramp_epochs: 5
  dct_v2_relation_tolerance: 0.0
  dct_v2_ipcw_rank_margin: 0.02
  dct_v2_ipcw_rank_temperature: 0.50
  dct_v2_ipcw_max_weight: 10.0
  dct_v2_ipcw_memory_size: 64
  dct_v2_variance_min: 0.001
  dct_v2_variance_max: 0.05
  dct_v2_target_pair_dist: 1.0
  dct_v2_pair_weight: 0.5

split_setup:
  which_splits: 5fold_uni2h_dct_v2_outer_test_seed3
  on_missing_wsi: error
